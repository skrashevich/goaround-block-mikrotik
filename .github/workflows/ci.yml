name: Go Build and Release

on:
  push:
    branches:
      - '*'

jobs:
  build:
    name: Build on ${{ matrix.os }} for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [windows, linux, macos]
        arch: [amd64, arm64]
        include:
          - os: windows
            goos: windows
            ext: .exe
          - os: linux
            goos: linux
            ext: ''
          - os: macos
            goos: darwin
            ext: ''

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set GOOS and GOARCH
        run: |
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go test ./...

      - name: Build
        run: |
          go build -ldflags "-s -w" -trimpath -v -o gbm-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbm-${{ matrix.os }}-${{ matrix.arch }}
          path: gbm-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  docker_build:
    name: Docker Build and Push
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/goaround-block-mikrotik:latest
          platforms: | 
            linux/arm64/v8
            linux/amd64
            linux/arm/v7
            linux/s390x
            linux/ppc64le

  release:
    name: Release
    needs: [build, docker_build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: gbm-*/*
          draft: false
          prerelease: false
